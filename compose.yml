services:
  glanceriff:
    image: ghcr.io/solidprogramming/glanceriff:latest
    build: .
    container_name: glanceriff
    restart: unless-stopped
    # Share the host's namespaces so GlanceRiff sees the host's processes,
    # network interfaces and hostname instead of the container's own.
    pid: host
    network_mode: host
    uts: host
    volumes:
      # Show the host's OS name instead of the container's.
      - /etc/os-release:/etc/os-release:ro
    # Optional: require a login for the dashboard and API, and/or a token for scripts.
    # environment:
    #   GLANCERIFF_USERNAME: admin
    #   GLANCERIFF_PASSWORD: change-me
    #   GLANCERIFF_TOKEN: change-me-too
    # With network_mode: host the server listens directly on the host.
    # Use 127.0.0.1:61208 to keep it local, 0.0.0.0:61208 to expose it.
    command: ["--web", "--bind", "0.0.0.0:61208"]
